services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: workcode
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: workcode
    volumes:
      - workcode_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workcode"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://workcode:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}@db:5432/workcode
      STORAGE_ROOT: /app/storage
      DOCKER_STORAGE_VOLUME: ${DOCKER_STORAGE_VOLUME:-}
      ENV: production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - workcode_storage:/app/storage
      # Uncomment ONLY when RUNNER_MODE=docker (spawns sandbox containers):
      # - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro

volumes:
  workcode_pgdata:
  workcode_storage:
